<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webby</title>

    <!-- Подключение fontIcons -->
    <link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v6.6.0/css/all.css">
    
    <link rel="stylesheet" href="styles/global.css">
    <script src="scripts/shows.js" defer></script>
</head>
<body>
    
    <header class="header">

        <div class="container">

            <div class="header__wrapper">
                
                <div class="logo">
                    Webby
                </div>
                <!-- /.logo -->
                
                <nav class="header__menu">
                    <ul class="header__menu-list">

                        <li class="menu__item">
                            <a href="./index.html">Фильмы</a>
                        </li>

                        <li class="menu__item">
                            <a href="./shows.html">Сериалы</a>
                        </li>

                        <li class="menu__item">
                            <a href="./anime.html">Аниме</a>
                        </li>

                        <li class="menu__item">
                            <a href="./cartoons.html">Мультфильмы</a>
                        </li>

                    </ul>
                </nav>
                <!-- /.header__menu -->

                <form class="search" action="">
                    <input
                        class="search__input"
                        type="text"
                        placeholder="Поиск по жанру"
                    >

                    <button class="search__button" type="submit">
                        <i class="bx bx-search"></i>
                    </button>
                </form>
                <!-- /.search -->

                <a class="profile" href="#">
                    <i class="bx bx-user"></i>
                </a>
                <!-- /.profile -->

            </div>
            <!-- /.header__wrapper -->

        </div>
        <!-- /.container -->

    </header>
    
    
    <br>


    <main class="main">

        <div class="container">

            <section class="hero">
                <h1 class="hero__title">
                    <span>Самое популярное среди зрителей</span>
                </h1>


            </section>
            <!-- /.hero -->

            <div class="slider-container">

                <!-- кнопка для пролистывани слайдера влево -->
                <button class="slider-btn prev">
                    <i class="bx bx-caret-big-left"></i>
                </button>

                <div class="slider-wrapper">

                    <div class="slider">

                        <div class="slider__card">
                            <img src="images/shows/main-slider-imgs/Ведьмак.jpg" alt="">
                        </div>

                        <div class="slider__card">
                            <img src="images/shows/main-slider-imgs/Игра Престолов.jpg" alt="">
                        </div>

                        <div class="slider__card">
                            <img src="images/shows/main-slider-imgs/Презумпция Невиновности.jpg" alt="">
                        </div>

                        <div class="slider__card">
                            <img src="images/shows/main-slider-imgs/Уэнздей.jpg" alt="">
                        </div>

                        <div class="slider__card">
                            <img src="images/shows/main-slider-imgs/Друзья.jpg" alt="">
                        </div>

                        <div class="slider__card">
                            <img src="images/shows/main-slider-imgs/Пацаны.jpg" alt="">
                        </div>
                        
                        <div class="slider__card">
                            <img src="images/shows/main-slider-imgs/Прослушка.jpg" alt="">
                        </div>

                    </div>
                    <!-- /.slider -->

                </div>
                <!-- /.slider-wrapper -->

                <!-- кнопка для пролистывани слайдера вправо -->
                <button class="slider-btn next">
                    <i class="bx bx-caret-big-right"></i>
                </button>
                

            </div>
            <!-- /.slider-container -->

        </div>
        <!-- /.container -->    
        
            <div class="movies">

                <h3 class="movies__title">Драма</h3>
                    <div class="movies__wrapper">

                        <div id="drama" class="movies__slider drama-slider">

                        </div>

                    </div>
                    <!-- /.movies__wrapper -->


                <h3 class="movies__title">Боевик</h3>
                    <div class="movies__wrapper">

                        <div id="action" class="movies__slider action-slider">

                        </div>

                    </div>
                    <!-- /.movies__wrapper -->
                    
                    
                <h3 class="movies__title">Триллер</h3>
                    <div class="movies__wrapper">

                        <div id="thriller" class="movies__slider thriller-slider">

                        </div>

                    </div>
                    <!-- /.movies__wrapper -->
                    
                    
                <h3 class="movies__title">Детектив</h3> 
                    <div class="movies__wrapper">

                        <div id="detective" class="movies__slider detective-slider">
                            
                        </div>
                        
                    </div>
                    <!-- /.movies__wrapper -->
                    

                <h3 class="movies__title">Комедия</h3>
                    <div class="movies__wrapper">
                        
                        <div id="comedy" class="movies__slider comedy-slider">

                        </div>

                    </div>
                    <!-- /.movies__wrapper -->


                <h3 class="movies__title">Приключения</h3>
                    <div class="movies__wrapper">

                        <div id="adventure" class="movies__slider adventure-slider">

                        </div>

                    </div>
                    <!-- /.movies__wrapper -->


                <h3 class="movies__title">Фентези</h3>
                    <div class="movies__wrapper">

                        <div id="fantasy" class="movies__slider fantasy-slider">

                        </div>

                    </div>
                    <!-- /.movies__wrapper -->


                <h3 class="movies__title">Исторические</h3>
                    <div class="movies__wrapper">

                        <div id="historical" class="movies__slider historical-slider">

                        </div>

                    </div>
                    <!-- /.movies__wrapper -->

            
            </div>
            <!-- /.movies -->

    </main>

    
    <footer class="footer">

        <div class="container">

            <div class="footer__wrapper">

                <div class="footer__logo">
                    Webby
                </div>


                <nav class="footer__menu">

                    <a href="./index.html">Фильмы</a>
                    <a href="./shows.html">Сериалы</a>
                    <a href="./anime.html">Аниме</a>
                    <a href="./cartoons.html">Мультфильмы</a>

                </nav>
                <!-- ./footer__menu -->


                <div class="footer__socials">

                    <a href="#">
                        <i class="fa-brands fa-youtube"></i>
                    </a>

                    <a href="#">
                        <i class="fa-brands fa-telegram"></i>
                    </a>

                    <a href="#">
                        <i class="fa-brands fa-discord"></i>
                    </a>

                </div>
                <!-- ./footer__socials -->

            </div>
            <!-- ./footer__wrapper -->

            <p class="footer__copyright">
                © 2026 Webby. All rights reserved.
            </p>

        </div>
         <!-- ./container -->

    </footer>
</body>
</html>
